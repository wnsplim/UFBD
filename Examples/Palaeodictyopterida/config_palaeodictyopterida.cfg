# Core input
fossils       = palaeodictyopterida.fossils

# Output
log_output    = output/palaeodictyopterida
tree_output   = output/palaeodictyopterida

# MCMC settings
chain_length    = auto
parallel_chains = 4
coupled_chains  = 4
thinning        = 20000
burn_in         = 0.25
cores           = 16
seed            = 42

# Convergence
max_gen = 500000000
min_ess = 400
rhat    = 1.01

# FBD model
conditioning = extinct exp:0.1,327
rho          = 1

[lambda]
time_bins = b0:(250,255) | b1:(255,260) | b2:(260,265) | b3:(265,270) | b4:(270,275) | b5:(275,280) | b6:(280,285) | b7:(285,290) | b8:(290,295) | b9:(295,300) | b10:(300,305) | b11:(305,310) | b12:(310,315) | b13:(315,320) | b14:(320,inf)
mode      = ou
ou_theta  = normal:log(0.2),1.6
ou_sd     = exp:3.3333
ou_nu     = exp:2

[mu]
time_bins = b0:(250,255) | b1:(255,260) | b2:(260,265) | b3:(265,270) | b4:(270,275) | b5:(275,280) | b6:(280,285) | b7:(285,290) | b8:(290,295) | b9:(295,300) | b10:(300,305) | b11:(305,310) | b12:(310,315) | b13:(315,320) | b14:(320,inf)
mode      = ou
ou_theta  = normal:log(0.2),1.6
ou_sd     = exp:3.3333
ou_nu     = exp:2

[psi]
time_bins = b0:(250,255) | b1:(255,260) | b2:(260,265) | b3:(265,270) | b4:(270,275) | b5:(275,280) | b6:(280,285) | b7:(285,290) | b8:(290,295) | b9:(295,300) | b10:(300,305) | b11:(305,310) | b12:(310,315) | b13:(315,320) | b14:(320,inf)
prior     = exp:10
mode      = indep
