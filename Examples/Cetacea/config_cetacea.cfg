# Core input
backbone_tree = cetacea.treefile
clade_def     = cetacea.clades
fossils       = cetacea.fossils
hessian       = in.BV

# Output
log_output    = output/cetacea
tree_output   = output/cetacea

# MCMC settings
chain_length    = auto
parallel_chains = 4
coupled_chains  = 4
thinning        = 5000
burn_in         = 0.25
cores           = 16
seed            = 42

# Convergence
max_gen = 500000000
min_ess = 400
rhat    = 1.01

# FBD model
conditioning = origin truncnorm:55,2,50
rho          = 1

[lambda]
time_bins = b0:(0,1) | b1:(1,2) | b2:(2,3) | b3:(3,4) | b4:(4,5) | b5:(5,6) | b6:(6,7) | b7:(7,8) | b8:(8,9) | b9:(9,10) | b10:(10,11) | b11:(11,12) | b12:(12,13) | b13:(13,14) | b14:(14,15) | b15:(15,16) | b16:(16,17) | b17:(17,18) | b18:(18,19) | b19:(19,20) | b20:(20,21) | b21:(21,22) | b22:(22,23) | b23:(23,24) | b24:(24,25) | b25:(25,26) | b26:(26,27) | b27:(27,28) | b28:(28,29) | b29:(29,30) | b30:(30,31) | b31:(31,32) | b32:(32,33) | b33:(33,34) | b34:(34,35) | b35:(35,36) | b36:(36,37) | b37:(37,38) | b38:(38,39) | b39:(39,40) | b40:(40,41) | b41:(41,42) | b42:(42,43) | b43:(43,44) | b44:(44,45) | b45:(45,46) | b46:(46,47) | b47:(47,48) | b48:(48,49) | b49:(49,50) | b50:(50,inf)
